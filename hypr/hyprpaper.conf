# See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# Wallpapers come from github:54L1M/walls, linked to ~/Pictures/walls by
# Home Manager (nix/hosts/pc/home.nix). Apply edits: pkill hyprpaper; hyprpaper &

wallpaper {
    monitor =                # empty = every monitor
    path = ~/Pictures/walls/gruvbox-nix.png
    fit_mode = cover         # cover | contain | tile | fill
}

splash = false
