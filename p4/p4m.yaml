# p4m Sessions Configuration
# Each session defines a development environment.
#
# Per-session keys:
#   path            (required) Working directory
#   env_file        (optional) Environment file to source in every window
#   virtualenv      (optional) Python virtualenv to `workon`
#   proxy           (optional) Cloud SQL proxy profile to auto-start (p4p)
#   global_commands (optional) Commands run in EVERY window
#   windows         (required) Ordered list of windows to create
#   extra_windows   (optional) Extra windows appended after `windows` — add a
#                              window to a shared *anchor layout for one session
#
# Each window entry:
#   name            (required) tmux window name
#   editor          (optional) If true, opens `nvim .` after commands
#   commands        (optional) Commands run only in this window
#
# Reusable layouts live under `x-*` keys (ignored by p4m) and are pulled
# into a session with a YAML anchor, e.g. `windows: *dev`.

x-layouts:
  dev: &dev
    - { name: code, editor: true }
    - { name: shell }
    - { name: server }
    - { name: db }
  simple: &simple
    - { name: code, editor: true }
    - { name: shell }
    - { name: claude }

ats:
  path: ~/Documents/Workstation/In2Dialog/I2D_ATS/
  env_file: ~/Documents/Workstation/In2Dialog/I2D_ATS/.env
  global_commands:
    - "source ./.venv/bin/activate"
  windows: *dev

prod:
  path: ~/Documents/Workstation/In2Dialog/prod/
  env_file: ~/Documents/Workstation/In2Dialog/I2D_ATS/.env
  global_commands:
    - "source ./.venv/bin/activate"
  windows: *dev

staging:
  path: ~/Documents/Workstation/In2Dialog/staging/
  env_file: ~/Documents/Workstation/In2Dialog/I2D_ATS/.env
  global_commands:
    - "source ./.venv/bin/activate"
  windows: *dev
  extra_windows:
    - name: claude

i2c:
  path: ~/Documents/Workstation/In2Dialog/i2c/
  windows: *dev

shen:
  path: ~/shenfiles/
  windows: *simple

oshen:
  path: ~/Documents/pf4/Oshen.nvim/
  windows: *simple

manifest:
  path: ~/Documents/Workstation/In2Dialog/KubernetesManifests/
  windows: *dev

pf4:
  path: ~/Documents/pf4/
  windows: *simple

dsago:
  path: ~/Documents/pf4/algo-go/
  windows:
    - name: code
      editor: true
    - name: shell
    - name: tests
      commands:
        - "make test"
    - name: claude
